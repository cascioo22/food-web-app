services:
  # Backend API service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/foodweb.db
      - PHOTO_UPLOAD_DIR=/app/data/uploads/photos
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  # Frontend static files service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Enable only after the named Cloudflare tunnel and DNS route exist.
  cloudflared:
    image: cloudflare/cloudflared@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  backend_data:
    driver: local
