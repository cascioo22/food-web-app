<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Cooking · Food Webapp</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="cooking-page">
    <main class="page-shell cooking-shell">
      <header class="cooking-header">
        <a href="index.html">← Recipes</a
        ><button id="reset-progress-btn">Reset progress</button>
      </header>
      <div id="cooking-error" role="alert" class="status-message hidden"></div>
      <p class="eyebrow">In the kitchen</p>
      <h1 id="recipe-title-display">Loading recipe…</h1>
      <p id="cook-progress" role="status"></p>
      <progress
        id="progress-bar"
        max="100"
        value="0"
        aria-label="Cooking progress"
      ></progress>
      <section class="cooking-layout">
        <details open class="cooking-pantry">
          <summary>Ingredients</summary>
          <ul id="ingredients-container" class="ingredients-list"></ul>
          <button id="missing-ingredients">
            Add unchecked to a grocery list
          </button>
          <div id="missing-picker" class="hidden"></div>
        </details>
        <section class="cooking-directions">
          <div class="action-row">
            <h2>Instructions</h2>
            <button id="focus-mode" aria-pressed="false">
              Focus on one step
            </button>
          </div>
          <p id="step-label" role="status"></p>
          <ol id="steps-container" class="steps-list"></ol>
          <div class="step-navigation">
            <button id="previous-step">← Previous</button
            ><button id="next-step" class="btn btn-primary">Next →</button>
          </div>
        </section>
      </section>
      <section class="timer-panel" aria-labelledby="timer-title">
        <h2 id="timer-title">Kitchen timers</h2>
        <form id="timer-form" class="action-row" novalidate>
          <label
            >Label<input
              id="timer-label"
              maxlength="100"
              placeholder="Pasta" /></label
          ><label
            >Minutes<input
              id="timer-minutes"
              type="number"
              min="0.01"
              max="1440"
              step="0.01"
              value="5" /></label
          ><button class="btn btn-primary">Start timer</button>
        </form>
        <p class="hint">
          Timers keep time when backgrounded. Sound and background notifications
          are not guaranteed; keep the page open for completion feedback.
        </p>
        <ul id="timers" aria-label="Active timers"></ul>
        <p id="timer-announcement" role="status"></p>
      </section>
    </main>
    <script src="js/ui.js"></script>
    <script src="js/food_math.js"></script>
    <script src="js/cooking_mode.js"></script>
  </body>
</html>
