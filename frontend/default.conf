server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Handle SPA routing - rewrite /index.html requests to / (avoid 302 loop)
    location = /index.html {
        try_files $uri =404;
    }

    # Proxy API and app requests to backend, but serve static files for everything else
    location ~ ^/[^i].* {
        # Not starting with 'i' (not index.html) - likely an API call
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve static assets (css, js, images) directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri =404;
    }

    # Serve uploaded files
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        autoindex on;
    }
}
