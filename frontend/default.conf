server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    # API prefixes must never capture static pages such as /photos.html.
    location ~ ^/(recipes|nutrition|photos|grocery-lists)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
    }
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 40s;
    }
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /health {
        proxy_pass http://backend:8000;
    }
    location = /favicon.ico { return 204; }
    # Versioned Vite assets must never fall back to HTML; missing assets are errors.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
