<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=1440,height=900">
<link rel="stylesheet" href="../frontend/css/main.css">
<style>
.test-result { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; padding: 20px; font-family: monospace; z-index: 9999; }
</style>
<script>
const grid = document.getElementById('recipe-grid');
if (grid) {
    const computed = getComputedStyle(grid);
    const cols = computed.gridTemplateColumns;
    const resultDiv = document.createElement('div');
    resultDiv.className = 'test-result';
    const passed = cols.includes('4');
    resultDiv.innerHTML = '<h1>Desktop Recipe Grid Test</h1>' +
        `<p>Viewport: 1440x900</p>` +
        `<p>Grid columns: ${cols}</p>` +
        (passed ? '<p style="color:#4ade80;font-weight:bold;">✅ PASS: Desktop layout (4 cols)</p>' : '<p style="color:#f87171;font-weight:bold;">❌ FAIL</p>') +
        '<br><button onclick="window.close()">Close</button>';
    document.body.appendChild(resultDiv);
} else {
    const resultDiv = document.createElement('div');
    resultDiv.className = 'test-result';
    resultDiv.innerHTML = '<h1>Test Error</h1><p>Recipe grid not found.</p>';
    document.body.appendChild(resultDiv);
}
</script>
</head><body></body></html>
